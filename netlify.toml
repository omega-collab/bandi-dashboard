[build]
  publish = "public"
  command = "echo 'Static site, no build needed'"

# Redirection racine → dashboard
# (auth désactivée : la page /login.html reste accessible directement
#  mais n'est plus servie par défaut)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
