[build]
  publish = "public"
  command = "echo 'Static site, no build needed'"

# Redirection : la racine pointe vers login.html (page d'accueil)
# Le dashboard (index.html) reste accessible après authentification
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
