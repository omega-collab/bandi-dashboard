name: Auto-merge Claude branches to master

# Approche : push direct squash-merge vers master, sans passer par une PR.
# Évite le problème "Allow GitHub Actions to create and approve PRs" qui doit
# être coché manuellement dans Settings > Actions > General sinon `gh pr create`
# échoue.
#
# Conditions pour que ça marche :
# - Branch protection master ne doit PAS forcer "Require PR before merging"
#   (sinon le push direct sera rejeté). Par défaut, master n'a pas de protection
#   sur ce repo.
# - GITHUB_TOKEN doit avoir `contents: write` (configuré au niveau du job).
#
# Opt-out : ajouter [no-merge], [skip-merge] ou [wip] dans le commit message
# désactive le merge pour ce push (utile pour pousser du WIP).

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout master with full history
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the pushed branch
        run: git fetch origin "${GITHUB_REF#refs/heads/}":"${GITHUB_REF#refs/heads/}" || true

      - name: Detect [no-merge] flag in commit message
        id: gate
        run: |
          MSG=$(git log -1 --pretty=%B "$GITHUB_SHA")
          if echo "$MSG" | grep -qiE '\[no-merge\]|\[skip-merge\]|\[wip\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Flag détecté — auto-merge skippé"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash merge into master and push
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Branch: $BRANCH"
          echo "Head SHA: $GITHUB_SHA"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Si aucun nouveau commit en avance de master, sortir proprement
          AHEAD=$(git rev-list --count "master..$GITHUB_SHA")
          if [ "$AHEAD" -eq 0 ]; then
            echo "Aucun commit en avance de master — rien à merger."
            exit 0
          fi
          echo "$AHEAD commits en avance de master."

          # Titre = dernier commit message
          COMMIT_TITLE=$(git log -1 --pretty=%s "$GITHUB_SHA")
          COMMIT_BODY=$(git log -1 --pretty=%b "$GITHUB_SHA")

          # Squash-merge : prend tout le diff de la branche en un seul commit
          git merge --squash "$GITHUB_SHA"

          # Construit le message du commit de merge
          MERGE_MSG="$COMMIT_TITLE

          ${COMMIT_BODY}

          [auto-merge from $BRANCH @ ${GITHUB_SHA:0:7}]"

          git commit -m "$MERGE_MSG"
          git push origin master
          echo "Merge poussé sur master."
