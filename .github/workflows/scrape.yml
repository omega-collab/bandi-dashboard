name: Scrape FlixPatrol Bandi

on:
  schedule:
    # Toutes les 2 heures (UTC) — FlixPatrol bouge plusieurs fois par jour,
    # un cron 6h laissait le hero afficher un rang stale de plusieurs heures.
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Déclenchement manuel possible depuis GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run scraper FlixPatrol
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/scraper.js

      - name: Run scraper Tudum
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/scrape-tudum.js
        continue-on-error: true

      # I2 (audit) : validation post-scrape — fail le workflow si la DB
      # ne contient PAS le snapshot du jour. Évite les workflows verts
      # alors que le scrape a silencieusement échoué.
      - name: Verify today's snapshot in DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RES=$(curl -sf -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/bandi_snapshots?date=eq.$TODAY&select=date,score_monde,rang_monde")
          COUNT=$(echo "$RES" | grep -c '"date"' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Snapshot du $TODAY absent dans bandi_snapshots — scraper KO silencieux"
            exit 1
          fi
          echo "✓ Snapshot $TODAY présent : $RES"

      - name: Log execution
        if: always()
        run: echo "Scrape terminé à $(date -u)"
