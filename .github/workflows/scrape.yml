name: Scrape FlixPatrol Bandi

on:
  schedule:
    # Toutes les 2 heures (UTC) — FlixPatrol bouge plusieurs fois par jour,
    # un cron 6h laissait le hero afficher un rang stale de plusieurs heures.
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Déclenchement manuel possible depuis GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run scraper FlixPatrol
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Wrapper qui logge env + capture exit code → erreur visible dans Actions UI
        run: bash .github/scripts/run-scraper.sh scripts/scraper.js

      - name: Run scraper Tudum
        if: always()        # tente Tudum même si FlixPatrol a planté
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: bash .github/scripts/run-scraper.sh scripts/scrape-tudum.js
        continue-on-error: true

      - name: Verify today's snapshot in DB
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RES=$(curl -sf -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "$SUPABASE_URL/rest/v1/bandi_snapshots?date=eq.$TODAY&select=date,score_monde,rang_monde" || true)
          COUNT=$(echo "$RES" | grep -c '"date"' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::Snapshot du $TODAY absent dans bandi_snapshots — le scraper a échoué ou n'a pas trouvé de données."
          else
            echo "✓ Snapshot $TODAY présent : $RES"
          fi

      - name: Log execution
        if: always()
        run: echo "Scrape terminé à $(date -u)"
