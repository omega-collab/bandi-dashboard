name: Scrape FlixPatrol Bandi

on:
  schedule:
    # Toutes les 6 heures (UTC) : 00h, 06h, 12h, 18h
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Déclenchement manuel possible depuis GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run scraper FlixPatrol
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/scraper.js

      - name: Run scraper Tudum
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/scraper-tudum.mjs

      - name: Log execution
        if: always()
        run: echo "Scrape terminé à $(date -u)"
