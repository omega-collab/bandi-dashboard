name: Scrape Netflix Tudum Top 10

on:
  schedule:
    # Chaque mardi à 15h UTC (Tudum publie vers 14h UTC)
    - cron: '0 15 * * 2'
  workflow_dispatch:  # Déclenchement manuel possible

jobs:
  scrape-tudum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      - name: Run Tudum scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: bash .github/scripts/run-scraper.sh scripts/scrape-tudum.js
