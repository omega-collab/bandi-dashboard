name: Scrape Ratings (IMDb · TMDB · Allociné · SensCritique · RT · Filmaffinity · Wikipedia)

on:
  schedule:
    # Toutes les 6h — 00h15, 06h15, 12h15, 18h15 UTC
    - cron: '15 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci || npm install

      # Tous les scrapers passent par run-scraper.sh : capture stdout/stderr,
      # exit visible, ::error:: GitHub Actions UI si plante. continue-on-error
      # garde le pipeline complet : un scraper KO n'empêche pas les autres.
      - name: Scrape IMDb (aggregateRating)
        env:
          IMDB_TITLE_ID: tt37024175
        run: bash .github/scripts/run-scraper.sh scripts/scrape-imdb.js
        continue-on-error: true

      - name: Scrape TMDB (API officielle)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_TV_ID: '269161'
        run: bash .github/scripts/run-scraper.sh scripts/scrape-tmdb.js
        continue-on-error: true

      - name: Scrape SensCritique (communauté FR)
        env:
          SENSCRITIQUE_ID: '133850632'
          SENSCRITIQUE_SLUG: 'bandi'
        run: bash .github/scripts/run-scraper.sh scripts/scrape-senscritique.js
        continue-on-error: true

      - name: Scrape Filmaffinity (communauté ES)
        env:
          FILMAFFINITY_ID: '923114'
        run: bash .github/scripts/run-scraper.sh scripts/scrape-filmaffinity.js
        continue-on-error: true

      - name: Scrape Allociné (public + presse)
        env:
          ALLOCINE_SERIE_ID: '1000000157'
        run: bash .github/scripts/run-scraper.sh scripts/scrape-allocine.js
        continue-on-error: true

      - name: Scrape Rotten Tomatoes (tomatometer + audience)
        env:
          RT_TV_SLUG: 'bandi'
        run: bash .github/scripts/run-scraper.sh scripts/scrape-rottentomatoes.js
        continue-on-error: true

      - name: Scrape Wikipedia pageviews (FR + EN)
        run: bash .github/scripts/run-scraper.sh scripts/scrape-wikipedia.js
        continue-on-error: true

      - name: Log execution
        if: always()
        run: echo "Ratings scrape terminé à $(date -u)"
