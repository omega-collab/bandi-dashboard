name: Scrape Ratings (IMDb · TMDB · Allociné · SensCritique · RT · Filmaffinity · Wikipedia)

on:
  schedule:
    # Toutes les 6h — 00h15, 06h15, 12h15, 18h15 UTC
    # Décalé de 15 min pour ne pas tomber en même temps que buzz-scrape / flixpatrol-scrape
    - cron: '15 */6 * * *'
  workflow_dispatch:  # Déclenchement manuel possible

jobs:
  scrape-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      # ─── Notes /10 (IMDb + TMDB + SensCritique + Filmaffinity) ────────
      - name: Scrape IMDb (aggregateRating)
        env:
          IMDB_TITLE_ID: tt37024175
        run: node scripts/scrape-imdb.js
        continue-on-error: true

      - name: Scrape TMDB (API officielle)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_TV_ID: '269161'
        run: node scripts/scrape-tmdb.js
        continue-on-error: true

      - name: Scrape SensCritique (communauté FR)
        env:
          SENSCRITIQUE_ID: '133850632'
          SENSCRITIQUE_SLUG: 'bandi'
        run: node scripts/scrape-senscritique.js
        continue-on-error: true

      - name: Scrape Filmaffinity (communauté ES)
        env:
          FILMAFFINITY_ID: '923114'
        run: node scripts/scrape-filmaffinity.js
        continue-on-error: true

      # ─── Notes /5 ou /100 ──────────────────────────────────────────────
      - name: Scrape Allociné (public + presse)
        env:
          ALLOCINE_SERIE_ID: '1000000157'
        run: node scripts/scrape-allocine.js
        continue-on-error: true

      - name: Scrape Rotten Tomatoes (tomatometer + audience)
        env:
          RT_TV_SLUG: 'bandi'
        run: node scripts/scrape-rottentomatoes.js
        continue-on-error: true

      # ─── Signal d'intérêt (Wikipedia pageviews) ───────────────────────
      - name: Scrape Wikipedia pageviews (FR + EN)
        run: node scripts/scrape-wikipedia.js
        continue-on-error: true
