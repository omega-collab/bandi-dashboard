<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BANDI · Accès équipe production</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --rouge: #CE1126;
      --vert:  #009739;
      --gold:  #E4B84D;
      --bg:    #0A0A0A;
      --surface:   #141414;
      --surface-2: #1C1C1C;
      --surface-3: #262626;
      --border:    rgba(255,255,255,0.08);
      --text:      #F5F5F5;
      --text-sub:  #B0B0B0;
      --muted:     #808080;
      --dim:       #4a4a4a;
      --font-display: 'Anton', Impact, sans-serif;
      --font-body:    'Inter Tight', -apple-system, sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(206, 17, 38, 0.08) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 70%, rgba(0, 151, 57, 0.06) 0%, transparent 45%),
        var(--bg);
    }

    /* Barres drapeau Martinique haut/bas */
    .flag-bar {
      position: fixed;
      left: 0; right: 0;
      height: 4px;
      display: flex;
      z-index: 10;
      pointer-events: none;
    }
    .flag-bar.top { top: 0; }
    .flag-bar.bottom { bottom: 0; }
    .flag-bar span { flex: 1; }
    .flag-bar .rouge { background: var(--rouge); }
    .flag-bar .noir  { background: #000; }
    .flag-bar .vert  { background: var(--vert); }

    /* Container principal centré */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeUp 0.7s var(--ease);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo diamant */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .diamond {
      width: 68px;
      height: 68px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, var(--rouge) 0%, #9a0d1c 100%);
      border: 2px solid var(--rouge);
      box-shadow:
        0 0 30px rgba(206, 17, 38, 0.35),
        inset 0 0 20px rgba(0,0,0,0.35);
      position: relative;
      transition: transform 0.6s var(--ease), box-shadow 0.4s var(--ease);
      cursor: default;
    }
    .diamond::before {
      content: 'B';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 34px;
      color: #fff;
      transform: rotate(-45deg);
      letter-spacing: -0.02em;
    }
    .diamond:hover {
      transform: rotate(225deg);
      box-shadow:
        0 0 45px rgba(206, 17, 38, 0.55),
        inset 0 0 20px rgba(0,0,0,0.35);
    }
    .diamond:hover::before {
      transform: rotate(-225deg);
    }

    .title-block {
      text-align: center;
    }
    .title {
      font-family: var(--font-display);
      font-size: 42px;
      letter-spacing: 0.01em;
      line-height: 1;
      color: var(--text);
    }
    .title .dot {
      color: var(--rouge);
      margin: 0 6px;
    }
    .subtitle {
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* Formulaire */
    .login-form {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
    }
    .login-form::before {
      content: '';
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--rouge), transparent);
      opacity: 0.6;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: var(--font-mono);
    }
    .field input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 13px 14px;
      outline: none;
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    .field input::placeholder {
      color: var(--dim);
      font-style: italic;
    }
    .field input:focus {
      border-color: var(--rouge);
      background: var(--surface-3);
      box-shadow: 0 0 0 3px rgba(206, 17, 38, 0.12);
    }
    .field .hint {
      font-size: 11px;
      color: var(--dim);
      font-style: italic;
      margin-top: 2px;
    }

    .submit-btn {
      margin-top: 6px;
      background: var(--rouge);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 18px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.15s var(--ease);
    }
    .submit-btn:hover {
      background: #e21530;
      box-shadow: 0 0 24px rgba(206, 17, 38, 0.5);
      transform: translateY(-1px);
    }
    .submit-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      display: none;
      background: rgba(206, 17, 38, 0.08);
      border: 1px solid rgba(206, 17, 38, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #ff6b7a;
      text-align: center;
    }
    .error-msg.visible {
      display: block;
      animation: errIn 0.3s var(--ease);
    }
    @keyframes errIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Shake animation */
    .login-form.shake {
      animation: shake 0.5s var(--ease);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%      { transform: translateX(-8px); }
      30%      { transform: translateX(8px); }
      45%      { transform: translateX(-6px); }
      60%      { transform: translateX(6px); }
      75%      { transform: translateX(-3px); }
      90%      { transform: translateX(3px); }
    }

    /* Footer */
    .login-footer {
      text-align: center;
      padding: 20px;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
      font-family: var(--font-mono);
    }
    .login-footer .divider {
      color: var(--rouge);
      margin: 0 8px;
    }
    .helper-text {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      max-width: 360px;
      margin: 8px auto 0;
      line-height: 1.5;
      font-style: italic;
    }

    @media (max-width: 500px) {
      .title { font-size: 34px; }
      .login-form { padding: 26px 20px; }
    }
  </style>
</head>
<body>

  <!-- Barre drapeau Martinique (haut) -->
  <div class="flag-bar top">
    <span class="rouge"></span>
    <span class="noir"></span>
    <span class="vert"></span>
  </div>

  <!-- Auto-redirect si déjà authentifié (avant tout rendu) -->
  <script>
    if (sessionStorage.getItem('bandi_auth') === 'ok') {
      window.location.replace('index.html');
    }
  </script>

  <main class="login-wrap">
    <div class="login-card">

      <div class="logo-wrap">
        <div class="diamond" aria-hidden="true"></div>
        <div class="title-block">
          <h1 class="title">BANDI<span class="dot">·</span>DASHBOARD</h1>
          <div class="subtitle">Accès équipe production</div>
        </div>
      </div>

      <form class="login-form" id="loginForm" autocomplete="off" novalidate>

        <div class="field">
          <label for="nameInput">Nom complet</label>
          <input
            type="text"
            id="nameInput"
            name="name"
            placeholder="Prénom Nom"
            autocomplete="off"
            autofocus
            required
          />
          <div class="hint">Tel qu'il figure au générique de la série</div>
        </div>

        <div class="field">
          <label for="passwordInput">Mot de passe</label>
          <input
            type="password"
            id="passwordInput"
            name="password"
            placeholder="••••••••"
            autocomplete="off"
            required
          />
        </div>

        <div class="error-msg" id="loginError"></div>

        <button type="submit" class="submit-btn">Accéder au dashboard</button>
      </form>

      <p class="helper-text">
        Cet espace est réservé aux membres de la production BANDI.<br />
        Accès externe : identifiant <strong>public</strong> avec le mot de passe fourni.
      </p>

    </div>
  </main>

  <footer class="login-footer">
    Accès réservé <span class="divider">·</span> Production BANDI <span class="divider">·</span> Martinique
  </footer>

  <!-- Barre drapeau Martinique (bas) -->
  <div class="flag-bar bottom">
    <span class="rouge"></span>
    <span class="noir"></span>
    <span class="vert"></span>
  </div>

  <!-- Script auth -->
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  </script>

</body>
</html>
